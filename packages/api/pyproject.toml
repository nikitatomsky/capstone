[project]
name = "field-intake-api"
version = "0.1.0"
description = ""
authors = [
    {name = "Nikita Tomsky",email = "tomsky@bessemer.com"}
]
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.52.1,<0.53.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "python-telegram-bot (>=22.8,<23.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "anthropic (>=0.120.2,<0.121.0)",
    "tenacity (>=9.0.0,<10.0.0)",
    "python-dotenv (>=1.0.0,<2.0.0)",
    "boto3 (>=1.43.63,<2.0.0)",
    "sse-starlette (>=2.1.3,<3.0.0)",
    "botocore[crt] (>=1.43.64,<2.0.0)"
]


[tool.poetry]
packages = [{include = "app"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.16.1,<0.17.0)"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C90", "UP", "DTZ", "PIE"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# B008: FastAPI uses Depends() in default arguments - this is the idiomatic pattern
"app/routers/*.py" = ["B008"]
