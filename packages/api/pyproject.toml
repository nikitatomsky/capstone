[project]
name = "field-intake-api"
version = "0.1.0"
description = ""
authors = [
    {name = "Nikita Tomsky",email = "tomsky@bessemer.com"}
]
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.52.1,<0.53.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "python-telegram-bot (>=22.8,<23.0)",
    "httpx (>=0.28.1,<0.29.0)"
]


[tool.poetry]
packages = [{include = "app"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.16.1,<0.17.0)"
]
