name: Field Intake Service CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  golden-path:
    name: Golden Path
    uses: ./.github/workflows/golden-path-ci.yml
    with:
      python-version: "3.12"
      api-working-directory: packages/api
      terraform-working-directory: infra/stacks/dev
